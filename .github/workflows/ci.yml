name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: System audio lib
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 只打印不依赖音频设备的模块：mediapipe 导入时会初始化 sounddevice/PortAudio，
      # 无头 runner 上没有 PulseAudio 会直接抛错，因此不在此处 import。
      - name: Show environment
        run: python -c "import cv2, numpy, zmq, google.protobuf; print('cv2', cv2.__version__, '| numpy', numpy.__version__, '| protobuf', google.protobuf.__version__)"

      # 全量跑。models/ 的权重不入库，感知用例检测到缺失会自动 skip，
      # 不需要 --ignore（那会掩盖真实失败）。
      - name: Tests
        run: pytest tests -q

      - name: Renderer smoke (standalone)
        run: node tests/js_smoke.mjs 3d/index.html
